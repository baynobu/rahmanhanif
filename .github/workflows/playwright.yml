name: Playwright Tests for Portfolio

on:
  push:
    branches: [ main, master, develop, test-playwright ]
  pull_request:
    branches: [ main, master, develop, test-playwright ]

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install chromium --with-deps

      - name: Build Next.js Production Bundle
        run: npm run build

      - name: Eksekusi Pengujian Otomatis Playwright E2E
        run: npx playwright test

      - name: Upload Test Report Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

